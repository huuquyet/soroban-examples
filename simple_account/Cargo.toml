[package]
name = "soroban-simple-account-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "21.7.5" }

[dev-dependencies]
soroban-sdk = { version = "21.7.5", features = ["testutils"] }
ed25519-dalek = { version = "2.0.0" }
rand = { version = "0.8.6" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
